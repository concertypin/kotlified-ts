# Publishes to npm using OIDC trusted publishing — no long-lived tokens needed.
#
# Prerequisites:
#   1. Configure npm Trusted Publisher for this repo on npmjs.com
#      → Package Settings → Manage Access → Add New Publisher
#   2. Set Owner: concertypin, Repository: kotlified-ts
#   3. Environment: leave blank (uses any branch)
#
# References:
#   - npm OIDC trusted publishing: https://docs.npmjs.com/trusted-publishers/

name: Publish

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

permissions:
    id-token: write # required for npm OIDC token exchange
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm run build

            # npm CLI (v11+) natively exchanges the GitHub Actions OIDC token when
            # ACTIONS_ID_TOKEN_REQUEST_* env vars are present and no NPM_TOKEN is
            # set.  pnpm publish delegates to the same auth mechanism.
            - run: pnpm publish
